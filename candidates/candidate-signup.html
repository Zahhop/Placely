<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Sign Up | Placely Talent</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }

    header {
      background: #0f172a;
      padding: 20px 8%;
    }

    .logo {
      color: white;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .signup-wrapper {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 8%;
    }

    .signup-card {
      width: 100%;
      max-width: 620px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .signup-card h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .signup-card p {
      color: #64748b;
      margin-bottom: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: span 2;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .signup-btn {
  width: 100%;
  margin-top: 26px;
  background: linear-gradient(135deg, #2563eb, #1e40af);
  color: white;
  border: none;
  padding: 15px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
  display: block;
  text-align: center;
}

    .login-text {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 14px;
    }

    .login-text a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .error-message {
      margin-top: 16px;
      color: #dc2626;
      font-weight: 600;
      font-size: 14px;
      display: none;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: span 1;
      }

      .signup-card {
        padding: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">PLACELY TALENT</div>
</header>

<section class="signup-wrapper">

  <div class="signup-card">
    <h1>Create your account</h1>
    <p>Start with the basics. You’ll complete your full work profile next.</p>

    <form id="candidateSignupForm">

      <div class="form-grid">

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" required>
        </div>

        <div class="form-group">
          <label for="postalCode">Postal Code</label>
          <input type="text" id="postalCode" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group full">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6">
        </div>

      </div>

      <a href="candidate-setup.html" class="signup-btn">
          Continue to Profile Setup
      </a>

      <p class="error-message" id="errorMessage"></p>

    </form>

    <div class="login-text">
      Already have an account?
      <a href="candidate-login.html">Log in</a>
    </div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/candidate-signup.js"></script>

</body>
</html>
