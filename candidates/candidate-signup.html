<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Sign Up | Placely Talent</title>

  <link rel="stylesheet" href="../css/candidate-signup.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


</head>

<body>

<header>
  <div class="logo">PLACELY TALENT</div>
</header>

<section class="signup-wrapper">

  <div class="signup-card">
    <h1>Create your account</h1>
    <p>Start with the basics. You’ll complete your full work profile next.</p>

    <form id="candidateSignupForm">

      <div class="form-grid">

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" required>
        </div>

        <div class="form-group">
          <label for="postalCode">Postal Code</label>
          <input type="text" id="postalCode" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group full">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6">
        </div>

      </div>

      <a href="candidate-setup.html" class="signup-btn">
          Continue to Profile Setup
      </a>

      <p class="error-message" id="errorMessage"></p>

    </form>

    <div class="login-text">
      Already have an account?
      <a href="candidate-login.html">Log in</a>
    </div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/candidate-signup.js"></script>

</body>
</html>
