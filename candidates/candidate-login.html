<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candidate Login | Placely Talent</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.28), transparent 34%),
        radial-gradient(circle at 100% 100%, rgba(30, 64, 175, 0.2), transparent 32%),
        #0f172a;
      color: #ffffff;
      overflow-x: hidden;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 26px 8%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-decoration: none;
    }

    .back-link {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.25s ease;
    }

    .back-link:hover {
      color: #ffffff;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 8% 70px;
    }

    .login-shell {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      margin-bottom: 22px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.55);
      color: #93c5fd;
      font-size: 14px;
      font-weight: 600;
    }

    .eyebrow span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 0 18px rgba(37, 99, 235, 0.9);
    }

    h1 {
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.02;
      letter-spacing: -1.8px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    h1 strong {
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .description {
      max-width: 540px;
      margin: 0 auto 28px;
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.7;
    }

    .login-card {
      position: relative;
      width: 100%;
      padding: 34px;
      border-radius: 28px;
      background: rgba(15, 23, 42, 0.84);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
      overflow: hidden;
      text-align: left;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.18), transparent 45%),
        radial-gradient(circle at top right, rgba(96, 165, 250, 0.15), transparent 34%);
      pointer-events: none;
    }

    .form-inner {
      position: relative;
      z-index: 1;
    }

    .form-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 26px;
    }

    .form-label {
      color: #93c5fd;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .login-card h2 {
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.8px;
    }

    .secure-pill {
      white-space: nowrap;
      padding: 8px 12px;
      border-radius: 999px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    form {
      display: grid;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.24);
      outline: none;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.74);
      color: #ffffff;
      padding: 14px 15px;
      font-size: 14px;
      transition: all 0.25s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: rgba(96, 165, 250, 0.85);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.16);
    }

    .submit-btn {
      width: 100%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 16px 22px;
      border: none;
      border-radius: 12px;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      box-shadow: 0 18px 36px rgba(37, 99, 235, 0.3);
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.28s ease;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 46px rgba(37, 99, 235, 0.45);
    }

    .signup-note {
      margin-top: 18px;
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
    }

    .signup-note a {
      color: #93c5fd;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-note a:hover {
      color: #ffffff;
    }

    .forgot-link {
  font-size: 13px;
  color: #93c5fd;
  text-decoration: none;
  font-weight: 600;
}

.forgot-link:hover {
  color: #ffffff;
}

    @media (max-width: 700px) {
      .login-card {
        padding: 28px 22px;
      }

      .form-top {
        flex-direction: column;
        gap: 12px;
      }
    }

    @media (max-width: 520px) {
      header {
        padding: 24px 6%;
      }

      main {
        padding: 20px 6% 54px;
      }

      h1 {
        letter-spacing: -1.2px;
      }

      .description {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">

    <header>
      <a href="../index.html" class="logo">PLACELY TALENT</a>
      <a href="../public/login.html" class="back-link">Back to Login</a>
    </header>

    <main>

      <section class="login-shell">

        <div class="eyebrow">
          <span></span>
          Candidate Login
        </div>

        <h1>Access your <strong>candidate account</strong></h1>

        <p class="description">
          Login to manage your profile, applications, and opportunities with Placely Talent.
        </p>

        <div class="login-card">

          <div class="form-inner">

            <div class="form-top">
              <div>
                <div class="form-label">Placely Candidate Access</div>
                <h2>Login</h2>
              </div>

              <div class="secure-pill">
                Secure Candidate Portal
              </div>
            </div>

            <form id="loginForm">
  <input type="email" id="email" placeholder="you@example.com" required>
  <input type="password" id="password" placeholder="Enter your password" required>
  <button type="submit" class="submit-btn">Login to Account</button>

              

            </form>

            <p class="signup-note">
              Don’t have an account?
              <a href="candidate-signup.html">Create one here</a>
            </p>

          </div>

        </div>

      </section>

    </main>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/candidate-login.js"></script>

</body>
</html>
