<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placely Talent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 900px;
      padding: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    p {
      font-size: 18px;
      color: #cbd5f5;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 18px 36px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid #334155;
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: #1e293b;
      transform: translateY(-3px);
    }

    .footer {
      margin-top: 60px;
      font-size: 14px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">PLACELY TALENT</div>

    <h1>Elite Talent. Real Results.</h1>
    <p>Connecting high-performing tradespeople with companies that demand the best.</p>

    <div class="buttons">
      <a href="/employers.html" class="btn btn-primary">Hire Talent</a>
      <a href="/candidates.html" class="btn btn-secondary">Find Work</a>
    </div>

    <div class="footer">
      Trusted by growing companies across Canada
    </div>
  </div>

</body>
</html>
