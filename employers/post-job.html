<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Post a Job | Placely Talent</title>

  <link rel="stylesheet" href="../css/post-job.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <a href="../index.html" class="logo">PLACELY TALENT</a>
  <a href="employer-dashboard.html" class="back-btn">Back to Dashboard</a>
</header>

<main class="page-container">

  <section class="page-header">
    <h1>Post a Job</h1>
    <p>Create a job listing for candidates to view and apply to.</p>
  </section>

  <form class="job-card">

    <div class="form-grid">

      <div class="form-group">
        <label>Job Title</label>
        <input type="text" placeholder="Electrical Apprentice" />
      </div>

      <div class="form-group">
        <label>Company Name</label>
        <input type="text" placeholder="Your company name" />
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" placeholder="Calgary, AB" />
      </div>

      <div class="form-group">
        <label>Employment Type</label>
        <select>
          <option>Full-Time</option>
          <option>Part-Time</option>
          <option>Contract</option>
          <option>Temporary</option>
          <option>Rotation</option>
        </select>
      </div>

      <div class="form-group">
        <label>Pay Range</label>
        <input type="text" placeholder="$25 - $40/hr" />
      </div>

      <div class="form-group">
        <label>Experience Level</label>
        <select>
          <option>Entry Level</option>
          <option>Apprentice</option>
          <option>Journeyman</option>
          <option>Supervisor / Lead Hand</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Job Description</label>
        <textarea placeholder="Describe the role, responsibilities, schedule, job site, and what the candidate will be doing."></textarea>
      </div>

      <div class="form-group full">
        <label>Required Skills / Certifications</label>
        <textarea placeholder="CSTS, WHMIS, Fall Protection, tools, license, reliable transportation, etc."></textarea>
      </div>

      <div class="form-group full">
        <label>Benefits / Perks</label>
        <textarea placeholder="Overtime, benefits, growth opportunities, paid training, company vehicle, etc."></textarea>
      </div>

    </div>

    <div class="button-row">
      <button type="button" class="secondary-btn">Save Draft</button>
      <button type="button" class="submit-btn">Post Job</button>
    </div>

  </form>

</main>

</body>
</html>
