<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Employer Profile | Placely Talent</title>

  <link rel="stylesheet" href="../css/employer-profile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <a href="../index.html" class="logo">PLACELY TALENT</a>

  <div class="header-actions">
    <a href="employer-dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>
</header>

<form id="employerProfileForm" class="profile-container">

  <div class="profile-header">
    <div class="company-photo">
      <div class="photo-placeholder">LOGO</div>
    </div>

    <div class="company-info">
      <h1>Company Profile</h1>
      <p>
        Manage your company details, hiring preferences, branding,
        and employer information visible to candidates.
      </p>
    </div>
  </div>

  <div class="profile-card">

    <div class="section-title">
      <h2>Company Information</h2>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Company Name</label>
        <input id="company_name" type="text">
      </div>

      <div class="form-group">
        <label>Industry</label>
        <input id="industry" type="text">
      </div>

      <div class="form-group">
        <label>Company Email</label>
        <input id="company_email" type="text">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input id="phone" type="text">
      </div>

      <div class="form-group">
        <label>Company Website</label>
        <input id="company_website" type="text">
      </div>

      <div class="form-group">
        <label>Company Location</label>
        <input id="company_location" type="text">
      </div>

      <div class="form-group full">
        <label>Company Description</label>
        <textarea id="company_description"></textarea>
      </div>

    </div>

  </div>

  <div class="profile-card">

    <div class="section-title">
      <h2>Hiring Preferences</h2>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Main Hiring Industry</label>
        <select id="main_hiring_industry">
          <option>Electrical</option>
          <option>Construction</option>
          <option>HVAC</option>
          <option>Plumbing</option>
          <option>Oil & Gas</option>
        </select>
      </div>

      <div class="form-group">
        <label>Employment Type</label>
        <select id="employment_type">
          <option>Full-Time</option>
          <option>Part-Time</option>
          <option>Contract</option>
        </select>
      </div>

      <div class="form-group">
        <label>Typical Pay Range</label>
        <input id="pay_range" type="text">
      </div>

      <div class="form-group">
        <label>Hiring Timeline</label>
        <select id="hiring_timeline">
          <option>Immediately</option>
          <option>Within 2 Weeks</option>
          <option>Ongoing Hiring</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Preferred Candidate Qualities</label>
        <textarea id="candidate_qualities"></textarea>
      </div>

    </div>

  </div>

  <div class="save-row">
  <button type="submit" class="save-btn">Save Profile Changes</button>
</div>

</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../emp-js/employer-profile.js"></script>

</body>
</html>
