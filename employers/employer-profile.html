<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Employer Profile | Placely Talent</title>

  <link rel="stylesheet" href="../css/employer-profile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <a href="../index.html" class="logo">PLACELY TALENT</a>

  <div class="header-actions">
    <a href="employer-dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>
</header>

<div class="profile-container">

  <div class="profile-header">
    <div class="company-photo">
      <div class="photo-placeholder">LOGO</div>
    </div>

    <div class="company-info">
      <h1>Company Profile</h1>
      <p>
        Manage your company details, hiring preferences, branding,
        and employer information visible to candidates.
      </p>
    </div>
  </div>

  <div class="profile-card">

    <div class="section-title">
      <h2>Company Information</h2>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Company Name</label>
        <input type="text" placeholder="Northern Electric Ltd." />
      </div>

      <div class="form-group">
        <label>Industry</label>
        <input type="text" placeholder="Electrical / Construction" />
      </div>

      <div class="form-group">
        <label>Company Email</label>
        <input type="email" placeholder="info@company.com" />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" placeholder="(403) 555-5555" />
      </div>

      <div class="form-group">
        <label>Company Website</label>
        <input type="text" placeholder="www.company.com" />
      </div>

      <div class="form-group">
        <label>Company Location</label>
        <input type="text" placeholder="Calgary, AB" />
      </div>

      <div class="form-group full">
        <label>Company Description</label>
        <textarea placeholder="Tell candidates about your company, team culture, projects, and what makes your workplace stand out."></textarea>
      </div>

    </div>

  </div>

  <div class="profile-card">

    <div class="section-title">
      <h2>Hiring Preferences</h2>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Main Hiring Industry</label>
        <select>
          <option>Electrical</option>
          <option>Construction</option>
          <option>HVAC</option>
          <option>Plumbing</option>
          <option>Oil & Gas</option>
        </select>
      </div>

      <div class="form-group">
        <label>Employment Type</label>
        <select>
          <option>Full-Time</option>
          <option>Part-Time</option>
          <option>Contract</option>
        </select>
      </div>

      <div class="form-group">
        <label>Typical Pay Range</label>
        <input type="text" placeholder="$25 - $45/hr" />
      </div>

      <div class="form-group">
        <label>Hiring Timeline</label>
        <select>
          <option>Immediately</option>
          <option>Within 2 Weeks</option>
          <option>Ongoing Hiring</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Preferred Candidate Qualities</label>
        <textarea placeholder="Reliable, experienced, safety certified, team-oriented, etc."></textarea>
      </div>

    </div>

  </div>

  <div class="save-row">
    <button class="save-btn">Save Profile Changes</button>
  </div>

</div>

</body>
</html>
