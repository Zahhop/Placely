<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Find Candidates | Placely Talent</title>

  <link rel="stylesheet" href="../css/find-candidates.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <a href="../index.html" class="logo">PLACELY TALENT</a>
  <a href="employer-dashboard.html" class="back-btn">Back to Dashboard</a>
</header>

<main class="find-page" id="findPage">

  <div class="find-left">
    <section class="page-header">
      <h1>Find Candidates</h1>
      <p>Search skilled candidates by trade, city, experience, availability, and certifications.</p>
    </section>


    <section class="search-card">
      <div class="search-row">
      <input type="text" placeholder="Search by trade, name, skill, or keyword..." />

      <button type="button" class="filter-btn" id="filterBtn">
        Filters
      </button>

      <button type="button" class="search-btn">
        Search
      </button>
    </div>

    <div class="filters-panel" id="filtersPanel">
      <div class="filter-grid">

        <div class="filter-group">
          <label>City</label>
          <input type="text" placeholder="Calgary, Edmonton, Vancouver..." />
        </div>

        <div class="filter-group">
          <label>Experience</label>
          <select>
            <option>Any Experience</option>
            <option>0-1 Years</option>
            <option>2-4 Years</option>
            <option>5-10 Years</option>
            <option>10+ Years</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Can Start</label>
          <select>
            <option>Any Time</option>
            <option>Immediately</option>
            <option>Within 1 Week</option>
            <option>Within 2 Weeks</option>
            <option>Within 1 Month</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Job Type</label>
          <select>
            <option>Any Type</option>
            <option>Full-Time</option>
            <option>Part-Time</option>
            <option>Contract</option>
            <option>Rotation</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Certification</label>
          <input type="text" placeholder="CSTS, WHMIS, Fall Protection..." />
        </div>

        <div class="filter-group">
          <label>Trade</label>
          <select>
            <option>Any Trade</option>
            <option>Electrical</option>
            <option>Welding</option>
            <option>Plumbing</option>
            <option>HVAC</option>
            <option>Construction</option>
            <option>Oil & Gas</option>
          </select>
        </div>

      </div>

      <div class="filter-actions">
        <button type="button" class="clear-btn">Clear Filters</button>
        <button type="button" class="apply-btn">Apply Filters</button>
      </div>
    </div>
  </section>


<section class="candidate-grid" id="candidatesGrid"></section>
</div>

<aside class="candidate-detail-panel" id="candidateDetailPanel">
  <button class="close-panel-btn" id="closePanelBtn">×</button>
  <div id="candidateDetailContent"></div>
</aside>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../emp-js/find-candidates.js"></script>

</body>
</html>
