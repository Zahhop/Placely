<!DOCTYPE html>
<html lang="en" class="auth-booting">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Support | Placely Talent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="../emp-js/employer-sidebar-state.js"></script>
  <link rel="stylesheet" href="../css/manage-jobs.css" />
  <link rel="stylesheet" href="../css/employer-support.css" />
  <link rel="stylesheet" href="../css/employer-sidebar.css" />
</head>

<body data-plan="pro">
<div class="dashboard-shell manage-jobs-page support-page">
  <aside class="dashboard-sidebar" id="dashboardSidebar" aria-label="Employer navigation">
    <div class="sidebar-brand">
      <a href="employer-dashboard.html" class="brand-mark" aria-label="Placely Talent dashboard">P</a>
      <div>
        <a href="employer-dashboard.html" class="brand-name">PLACELY TALENT</a>
        <span>Employer Platform</span>
      </div>
    </div>

    <nav class="sidebar-nav" data-employer-nav aria-label="Employer sections"></nav>

    <div class="sidebar-footer">
      <section class="sidebar-plan-card" id="sidebarPlanCard" aria-live="polite"></section>

      <section class="sidebar-utility-section">
        <a href="employer-support.html" id="employerSupportSidebarLink" class="employer-nav-link nav-item active">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 1 10 10v5a3 3 0 0 1-3 3h-2v-8h3a8 8 0 1 0-16 0h3v8H5a3 3 0 0 1-3-3v-5A10 10 0 0 1 12 2Zm-3 8h2v10H9V10Zm4 0h2v10h-2V10Z"/></svg>
          <span>Support</span>
        </a>
        <a href="employer-profile.html" id="employerSettingsSidebarLink" class="employer-nav-link nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.28 7.28 0 0 0-1.69-.98L14.5 2.42A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42L9.12 5.07c-.61.24-1.18.56-1.69.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.02.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.62.22l2.47-1c.51.4 1.07.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.18-.58 1.69-.98l2.47 1c.23.09.49 0 .62-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
          <span>Settings</span>
        </a>
        <button type="button" id="logoutBtn" class="logout-btn nav-logout">Logout</button>
      </section>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <div class="dashboard-workspace">
    <header class="utility-bar">
      <button type="button" class="mobile-menu-btn" id="sidebarToggle" aria-controls="dashboardSidebar" aria-expanded="false">
        <span class="sr-only">Open navigation</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v2H4V7Zm0 4h16v2H4v-2Zm0 4h16v2H4v-2Z"/></svg>
      </button>
    </header>

    <main class="support-shell">
      <section class="page-hero support-hero">
        <div>
          <span class="eyebrow">SUPPORT</span>
          <h1>Support</h1>
          <p>Tell us what you need help with and the Placely team will get back to you.</p>
        </div>
      </section>

      <section class="support-panel">
        <form id="supportForm" class="support-form" novalidate>
          <div class="form-grid">
            <label class="form-group">
              <span>Support category</span>
              <select id="supportCategory" required>
                <option value="">Choose a category</option>
                <option>Account or login</option>
                <option>Billing or Candidate Access</option>
                <option>Job posting</option>
                <option>Candidates or saved talent</option>
                <option>Applications</option>
                <option>Messaging</option>
                <option>Company profile</option>
                <option>Technical issue</option>
                <option>Feedback or feature request</option>
                <option>Other</option>
              </select>
            </label>

            <label class="form-group">
              <span>Reply email</span>
              <input id="replyEmail" type="email" autocomplete="email" required />
            </label>

            <label class="form-group full">
              <span>Subject</span>
              <input id="supportSubject" type="text" maxlength="120" required />
            </label>

            <label class="form-group full">
              <span>Description</span>
              <textarea id="supportDescription" maxlength="5000" required></textarea>
              <small>Include what you were trying to do, what happened, and any error message you saw.</small>
            </label>

            <label class="form-group full">
              <span>Page context</span>
              <input id="sourcePage" type="text" readonly />
            </label>
          </div>

          <div id="supportMessage" class="support-message" role="status" aria-live="polite"></div>

          <div class="form-actions">
            <button type="submit" class="primary-btn" id="sendSupportBtn">Send Support Request</button>
            <a href="employer-dashboard.html" class="secondary-btn">Return to Dashboard</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth-utils.js"></script>
<script src="../js/auth-guards.js"></script>
<script src="../emp-js/employer-navbar.js"></script>
<script src="../emp-js/employer-support.js"></script>
</body>
</html>
