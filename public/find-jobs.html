<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Find Jobs | Placely Talent</title>

  <link rel="stylesheet" href="../css/find-jobs.css" />
  <link rel="stylesheet" href="../css/candidate-header.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <div class="logo-wrapper">
    <a href="../candidates/candidate-dashboard.html" class="logo">PLACELY TALENT</a>
    <div class="logo-subtitle">Talent Platform</div>
  </div>

  <nav>
    <a href="../candidates/candidate-dashboard.html">Dashboard</a>
    <a href="../public/find-jobs.html?role=candidate" class="active">Find Jobs</a>
    <a href="../public/saved-jobs.html">Saved Jobs</a>
    <a href="../candidates/candidate-applications.html">Applications</a>
    <a href="../candidates/candidate-messages.html">Messages</a>
    <a href="../candidates/candidate-profile.html">Profile</a>
    <a href="../candidates/candidate-settings.html">Settings</a>
    <button id="logoutBtn" class="nav-btn" type="button">Logout</button>
  </nav>
</header>

<main class="page-shell">

  <section class="search-card">
    <input id="keywordInput" type="text" placeholder="Search trade, company, keyword..." />

    <select id="locationFilter">
      <option value="">All locations</option>
    </select>

    <select id="typeFilter">
      <option value="">All job types</option>
      <option value="Full-time">Full-time</option>
      <option value="Part-time">Part-time</option>
      <option value="Contract">Contract</option>
      <option value="Apprenticeship">Apprenticeship</option>
    </select>

    <button id="searchBtn" type="button">Search</button>
  </section>

  <section class="jobs-browser">
    <aside class="jobs-list-panel">
      <div class="panel-header">
        <div>
          <span class="small-label">Open Roles</span>
          <h2>Available jobs</h2>
        </div>
        <strong id="jobCount">0</strong>
      </div>

      <div id="jobsList" class="jobs-list"></div>
    </aside>

    <section class="job-detail-panel" aria-live="polite">
      <div id="jobDetails" class="job-details-empty">
        <span class="small-label">Job Details</span>
        <h2>Select a job</h2>
        <p>Choose a role to view company details, requirements, pay, and apply.</p>
      </div>
    </section>
  </section>

</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth-guards.js"></script>
<script src="../js/find-jobs.js"></script>
<script src="../js/candidate-header.js"></script>

</body>
</html>
