<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Find Jobs | Placely Talent</title>

  <link rel="stylesheet" href="../css/find-jobs.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <div class="logo">PLACELY TALENT</div>

  <div class="header-actions">
    <a href="#" class="manage-btn employer-only">Manage Jobs</a>
    <a href="#" class="post-btn employer-only">Post Job</a>
    <a href="../candidates/candidate-dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>
</header>

<div class="container">

  <div class="hero">
    <h1>Find Jobs</h1>
    <p>Browse jobs matched to your experience and trade.</p>

    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="Search trades or keywords">

      <select id="locationFilter">
        <option value="">All Locations</option>
        <option value="Calgary">Calgary</option>
        <option value="Edmonton">Edmonton</option>
        <option value="Vancouver">Vancouver</option>
        <option value="Penticton">Penticton</option>
      </select>

      <select id="jobTypeFilter">
        <option value="">All Job Types</option>
        <option value="Full-Time">Full-Time</option>
        <option value="Part-Time">Part-Time</option>
        <option value="Contract">Contract</option>
        <option value="Temporary">Temporary</option>
        <option value="Rotation">Rotation</option>
      </select>

      <button class="search-btn" id="searchBtn">Search</button>
    </div>
  </div>

  <div class="jobs-layout">

    <div class="jobs-list" id="jobsGrid">
      <div class="job-card">Loading jobs...</div>
    </div>

    <div class="job-details-panel" id="jobDetailsPanel">
      <div class="empty-details">
        <h2>Select a job</h2>
        <p>Click a job on the left to view the full details.</p>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/find-jobs.js"></script>

</body>
</html>
