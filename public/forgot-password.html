<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Placely Talent</title>

  <link rel="stylesheet" href="../css/forgot-password.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  </head>

<body>
  <div class="page-wrapper">
    <header>
      <a href="../index.html" class="logo">PLACELY TALENT</a>
      <a href="login.html" class="back-link">Back to Login</a>
    </header>

    <main>
      <section class="auth-shell">
        <div class="eyebrow"><span></span> Account Recovery</div>

        <h1>Reset your <strong>password</strong></h1>

        <p class="description">
          Enter the email connected to your Placely account and we’ll send you a secure password reset link.
        </p>

        <div class="auth-card">
          <div class="card-inner">
            <div class="form-label">Forgot Password</div>
            <h2>Recover access</h2>
            <p class="card-copy">
              This works for both candidate and employer accounts.
            </p>

            <form id="forgotPasswordForm">
              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
              </div>

              <button type="submit" class="submit-btn">Send Reset Link</button>
              <p id="message" class="message"></p>
            </form>

            <p class="login-note">
              Remember your password? <a href="login.html">Login here</a>
            </p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/forgotpass.js"></script>


</body>
</html>
