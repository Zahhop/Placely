<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placely Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(30, 64, 175, 0.28), transparent 35%),
        #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .login-container {
      width: 100%;
      max-width: 520px;
      padding: 42px;
      border-radius: 28px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
    }

    .logo {
      display: inline-block;
      margin-bottom: 22px;
      text-decoration: none;
      color: white;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .small-label {
      color: #93c5fd;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 18px;
      letter-spacing: -2px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 34px;
      font-size: 15px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      box-shadow: 0 18px 36px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 46px rgba(37, 99, 235, 0.45);
    }

    .btn-secondary {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.24);
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      background: rgba(51, 65, 85, 0.85);
    }

    .back-home {
      display: inline-block;
      margin-top: 28px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
    }

    .back-home:hover {
      color: white;
    }

    @media (max-width: 600px) {
      .login-container {
        padding: 30px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <a href="../index.html" class="logo">PLACELY TALENT</a>

    <div class="small-label">Login Portal</div>

    <h1>Choose Your Account</h1>

    <p>
      Select the account type that matches your role. Employers can manage hiring and talent access. Workers can explore opportunities and manage applications.
    </p>

    <div class="buttons">
      <a href="../employers/employer-login.html" class="btn btn-primary">
        Employer Login
      </a>

      <a href="../candidates/candidate-login.html" class="btn btn-secondary">
        Worker Login
      </a>
    </div>

    <a href="../index.html" class="back-home">
      ← Back to Home
    </a>

  </div>

</body>
</html>
